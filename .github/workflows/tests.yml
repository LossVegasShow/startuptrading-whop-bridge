name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    name: pytest (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sut_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests (SQLite)
        if: matrix.database == 'sqlite'
        run: python -m pytest
      - name: Run tests (PostgreSQL, as in production)
        if: matrix.database == 'postgres'
        env:
          SUT_TEST_FORCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sut_test
        run: python -m pytest
      - name: Docker image builds
        if: matrix.database == 'sqlite'
        run: docker build -t startuptrading-bridge-ci .
