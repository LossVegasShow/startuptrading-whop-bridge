name: video-publish

# Builds each AI-produced video and uploads it to YouTube, scheduled for its publish time.
# Daily: every episode whose publish_at (in video/uploads/*.json) is within the next
# 3 days is built and uploaded as a scheduled video. Already-uploaded titles are skipped, so
# re-runs are safe. Or run it by hand for one episode.
on:
  schedule:
    - cron: '23 13 * * *'   # daily, 13:23 UTC
  workflow_dispatch:
    inputs:
      episode:
        description: 'Episode id (e.g. 001-how-many-contracts). Empty = everything due in 3 days.'
        default: ''
      privacy:
        description: 'Only used when the episode has no publish_at: private, unlisted or public'
        default: 'private'

permissions:
  contents: read

concurrency:
  group: video-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          missing=""
          for v in YT_CLIENT_ID YT_CLIENT_SECRET YT_REFRESH_TOKEN ELEVENLABS_API_KEY; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Missing secrets:$missing. See video/UPLOAD.md. Skipping."
            echo "skip=1" >> "$GITHUB_ENV"
          fi
      - name: Which episodes
        if: env.skip != '1'
        env:
          EPISODE: ${{ github.event.inputs.episode }}
        run: |
          if [ -n "$EPISODE" ]; then
            case "$EPISODE" in *[!a-z0-9-]*) echo "::error::Bad episode id"; exit 1;; esac
            echo "video/uploads/$EPISODE.json" > due.txt
          else
            python3 video/publish.py --due 3 > due.txt
          fi
          cat due.txt
          [ -s due.txt ] || echo "none=1" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        if: env.skip != '1' && env.none != '1'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: env.skip != '1' && env.none != '1'
        with:
          node-version: '22'
      - name: Install tools
        if: env.skip != '1' && env.none != '1'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -r video/requirements.txt
          npm install -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
      - name: Build and upload
        if: env.skip != '1' && env.none != '1'
        env:
          PRIVACY: ${{ github.event.inputs.privacy || 'private' }}
        run: |
          export NODE_PATH="$(npm root -g)"
          while read -r up; do
            ep="$(basename "$up" .json)"
            echo "::group::$ep"
            python video/build.py "video/episodes/$ep.json"
            python video/publish.py "$up" --privacy "$PRIVACY" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done < due.txt
      - uses: actions/upload-artifact@v4
        if: always() && env.skip != '1' && env.none != '1'
        with:
          name: videos-${{ github.run_number }}
          path: |
            video/out/*/*.mp4
            video/out/*/*.srt
            video/out/*/chapters.txt
          retention-days: 30
