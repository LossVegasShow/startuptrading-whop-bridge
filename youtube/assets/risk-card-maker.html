<!doctype html>
<!-- Fill in a trade, copy the URL into the OBS Browser source (1920x1080).
     Before the trade: state = plan. After: state = result with the ticks. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Risk Card maker</title>
<style>
  body { margin:0; background:#07090d; color:#ecf0f5; font:16px/1.5 Inter, system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:32px 20px; }
  h1 { font-size:24px; margin:0 0 6px } p { color:#8a96a8; margin:0 0 24px }
  form { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:14px; }
  label { display:grid; gap:6px; font-size:13px; color:#b3bcc9 }
  input, select { min-height:42px; padding:0 10px; border-radius:8px; border:1px solid #2a3441; background:#0b0e14; color:#ecf0f5; font:15px ui-monospace, Menlo, monospace }
  output { display:block; margin:24px 0 10px; padding:12px; border-radius:8px; background:#10151d; border:1px solid #1d2530; font:13px ui-monospace, Menlo, monospace; word-break:break-all }
  button { min-height:42px; padding:0 16px; border:0; border-radius:8px; background:#fa7b39; color:#170b03; font-weight:600; cursor:pointer }
  iframe { width:100%; aspect-ratio:16/9; border:1px solid #1d2530; border-radius:8px; margin-top:20px; background:#1a2230 }
</style>
</head>
<body>
<main>
  <h1>Risk Card maker</h1>
  <p>Fill in the trade before you click. Paste the URL into the OBS Browser source, or press Copy. Results are shown in ticks only.</p>
  <form id="f" onsubmit="return false">
    <label>Market<select name="m"><option>ES</option><option>MES</option><option>NQ</option><option>MNQ</option><option>CL</option><option>MCL</option><option>GC</option><option>MGC</option><option>YM</option><option>MYM</option><option>RTY</option><option>M2K</option></select></label>
    <label>Entry zone<input name="entry" placeholder="5125.25-5126.00"></label>
    <label>Stop (ticks)<input name="stop" type="number" min="1" value="24"></label>
    <label>Contracts<input name="qty" type="number" min="1" value="1"></label>
    <label>Planned risk ($)<input name="risk" type="number" min="0" value="300"></label>
    <label>State<select name="state"><option value="plan">Plan</option><option value="result">Result</option></select></label>
    <label>Result (ticks, +/-)<input name="res" type="number" placeholder="-24"></label>
    <label>Corner<select name="pos"><option value="bl">Bottom left</option><option value="br">Bottom right</option><option value="tl">Top left</option><option value="tr">Top right</option></select></label>
  </form>
  <output id="url"></output>
  <button type="button" id="copy">Copy URL</button>
  <iframe id="preview" title="Preview"></iframe>
</main>
<script>
(function () {
  var f = document.getElementById('f'), out = document.getElementById('url'), frame = document.getElementById('preview');
  var base = new URL('risk-card.html', location.href);
  function update() {
    var u = new URL(base);
    Array.prototype.forEach.call(f.elements, function (el) { if (el.name && el.value !== '') u.searchParams.set(el.name, el.value); });
    out.textContent = u.toString();
    frame.src = u.toString();
  }
  f.addEventListener('input', update);
  document.getElementById('copy').addEventListener('click', function () {
    try { navigator.clipboard.writeText(out.textContent); } catch (e) {}
  });
  update();
})();
</script>
</body>
</html>
