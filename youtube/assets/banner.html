<!doctype html>
<!-- Channel banner, 2560x1440. Everything that must be readable sits inside the
     1546x423 safe area in the centre (what every device shows). -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; width:2560px; height:1440px; overflow:hidden; background:#07090d; }
  .b { position:relative; width:2560px; height:1440px; font-family: Geist, Inter, system-ui, sans-serif;
    background: radial-gradient(60% 50% at 50% 50%, #131c29 0%, #07090d 70%); }
  svg.candles { position:absolute; inset:0; width:100%; height:100%; opacity:.22 }
  .safe { position:absolute; left:507px; top:508px; width:1546px; height:423px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
  .name { font:800 104px/1 Inter, system-ui, sans-serif; letter-spacing:-.03em; color:#ecf0f5; }
  .name span { color:#fa7b39 }
  .line { margin-top:26px; font:600 44px/1.2 Inter, system-ui, sans-serif; color:#b3bcc9; }
  .line b { color:#ecf0f5 }
  .tag { margin-top:24px; font:600 34px/1 ui-monospace, Menlo, monospace; letter-spacing:.06em; color:#fa7b39; }
  .guide { position:absolute; left:507px; top:508px; width:1546px; height:423px; outline:3px dashed rgba(255,255,255,.25); display:none }
  .show-guide .guide { display:block }
</style>
</head>
<body>
<div class="b" id="b">
  <svg class="candles" viewBox="0 0 2560 1440" preserveAspectRatio="none" id="candles"></svg>
  <div class="safe">
    <div class="name">Jack Gleason <span>|</span> StartUpTrading</div>
    <div class="line"><b>Live ES &amp; NQ futures</b> · Weekdays 9:00 ET</div>
    <div class="tag">I SHOW YOU MY RISK, NOT MY PROFITS</div>
  </div>
  <div class="guide"></div>
</div>
<script>
(function () {
  // Decorative candles (not market data), drawn from a fixed seed so the banner is identical every render.
  var s = 7, rnd = function () { s = (s * 16807) % 2147483647; return s / 2147483647; };
  var svg = document.getElementById('candles'), n = 90, w = 2560 / n, p = 720, out = '';
  for (var i = 0; i < n; i++) {
    var o = p, c = o + (rnd() - 0.47) * 70, hi = Math.max(o, c) + rnd() * 30, lo = Math.min(o, c) - rnd() * 30, x = i * w + w / 2;
    var col = c <= o ? '#3ddc97' : '#ff6b6b'; // screen y grows downward
    out += '<line x1="' + x + '" x2="' + x + '" y1="' + hi + '" y2="' + lo + '" stroke="' + col + '" stroke-width="3"/>';
    out += '<rect x="' + (x - w * 0.28) + '" y="' + Math.min(o, c) + '" width="' + (w * 0.56) + '" height="' + Math.max(3, Math.abs(c - o)) + '" fill="' + col + '"/>';
    p = Math.min(1150, Math.max(300, c));
  }
  svg.innerHTML = out;
  if (new URLSearchParams(location.search).get('guide') === '1') document.getElementById('b').classList.add('show-guide');
})();
</script>
</body>
</html>
