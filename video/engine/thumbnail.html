<!doctype html>
<!-- Thumbnail for videos made without a presenter, 1280x720. Three layers: big words, one number
     strip, the Risk Card. Parameters: l1, l2 (headline lines; l2 shown in orange), math (number strip),
     m, stop, qty, risk (Risk Card). Render: node video/engine/thumb.js <params.json> <out.png> -->
<html lang="en"><head><meta charset="utf-8"><style>
@font-face { font-family: Geist; src: url(fonts/Geist-Variable.woff2) format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'Geist Mono'; src: url(fonts/GeistMono-Variable.woff2) format('woff2'); font-weight: 100 900; }
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#07090d}
.t{position:relative;width:1280px;height:720px;font-family:Geist,Inter,sans-serif;color:#ecf0f5;
  background:radial-gradient(90% 90% at 25% 30%,#152033 0%,#07090d 65%)}
.l1,.l2{position:absolute;left:56px;font-weight:900;letter-spacing:-.04em;line-height:.92;text-transform:uppercase}
.l1{top:58px;font-size:112px}.l2{top:168px;font-size:132px;color:#fa7b39;text-shadow:0 6px 0 #170b03}
.math{position:absolute;left:56px;bottom:72px;font:700 54px/1 'Geist Mono',monospace;color:#ecf0f5;
  background:rgba(250,123,57,.12);border:3px solid #fa7b39;border-radius:16px;padding:22px 28px}
.card{position:absolute;right:52px;top:318px;width:440px;padding:26px 30px 22px 40px;background:rgba(11,14,20,.97);
  border:2px solid #2a3441;border-radius:18px;font:600 30px/1.25 'Geist Mono',monospace;transform:rotate(-2deg);
  box-shadow:0 20px 60px rgba(0,0,0,.6)}
.card:before{content:"";position:absolute;left:0;top:20px;bottom:20px;width:8px;background:#fa7b39;border-radius:0 4px 4px 0}
.card b{display:block;color:#fa7b39;font-size:24px;letter-spacing:.1em;margin-bottom:14px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid #1d2530}.row span{color:#8a96a8;font-family:Geist,sans-serif;font-weight:500}.row em{font-style:normal}
</style></head><body><div class="t">
<div class="l1" id="l1"></div><div class="l2" id="l2"></div><div class="math" id="math"></div>
<div class="card"><b id="cm"></b><div class="row"><span>Stop</span><em id="cs"></em></div><div class="row"><span>Size</span><em id="cq"></em></div><div class="row"><span>Risk</span><em id="cr"></em></div></div>
</div><script>
const q=new URLSearchParams(location.search),$=i=>document.getElementById(i);
$('l1').textContent=(q.get('l1')||'').slice(0,18);$('l2').textContent=(q.get('l2')||'').slice(0,14);
$('math').textContent=(q.get('math')||'').slice(0,28);$('math').hidden=!q.get('math');
$('cm').textContent='RISK CARD · '+(q.get('m')||'ES').toUpperCase().slice(0,6);
$('cs').textContent=(q.get('stop')||'—')+' ticks';$('cq').textContent=q.get('qty')||'—';$('cr').textContent=q.get('risk')?'$'+q.get('risk'):'—';
window.ready=document.fonts.load('900 100px Geist').then(()=>document.fonts.load('700 50px "Geist Mono"'));
</script></body></html>
